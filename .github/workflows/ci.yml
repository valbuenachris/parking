name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    name: Pruebas del backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instala dependencias
        run: pip install -r backend/requirements.txt
      - name: Ejecuta pytest (incluye concurrencia con WAL y saneo de migración)
        run: pytest backend/tests

  frontend:
    name: Frontend (npm ci && npm run build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instala desde el lockfile
        run: npm ci
      - name: Compila (tsc + vite build)
        run: npm run build

  certificado:
    name: Certificado TLS de runtime (SAN y guarda de producción)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verifica el SAN y que no se autofirma en producción
        run: sh frontend/tests/verificar-certificado.sh
