services:
  backend:
    build: ./backend
    environment:
      PARQUEADERO_DB: /datos/parqueadero.db
      PARQUEADERO_TOKEN: ${PARQUEADERO_TOKEN:?Define PARQUEADERO_TOKEN en un archivo .env}
      PARQUEADERO_ORIGENES: ${PARQUEADERO_ORIGENES:-https://localhost,http://localhost:5173}
      PARQUEADERO_RATE_LIMIT: ${PARQUEADERO_RATE_LIMIT:-120/60}
    volumes:
      - datos:/datos
    expose:
      - "8000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped

volumes:
  datos:
